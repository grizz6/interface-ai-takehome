{% extends "base.html" %}
{% block content %}
<table class="panel" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="panelhead">{{ v.titles.search }}</td></tr>
  <tr><td class="panelbody">
    {% if error %}
    <table class="errorbox" cellpadding="0" cellspacing="0" border="0"><tr><td>{{ error }}</td></tr></table>
    {% endif %}
    <form method="post" action="{{ url_for('search_submit') }}">
      <table cellpadding="4" cellspacing="0" border="0">
        <tr>
          <!-- LOCATOR TIER 1. This input carries a real label association, so
               role=textbox plus accessible name "Member ID" resolves it alone. -->
          <td class="fieldlabel">
            <label for="ctl00_ContentPlaceHolder1_txtMemberId">{{ v.labels.member_id }}</label>
          </td>
          <td>
            <input type="text" size="18"
                   id="ctl00_ContentPlaceHolder1_txtMemberId"
                   name="ctl00_ContentPlaceHolder1_txtMemberId">
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <!-- LOCATOR TIER 1. Submit inputs take their accessible name from value. -->
            <input type="submit" class="btn"
                   id="ctl00_ContentPlaceHolder1_btnSearch"
                   name="ctl00_ContentPlaceHolder1_btnSearch"
                   value="{{ v.labels.search_submit }}">
          </td>
        </tr>
      </table>
    </form>
  </td></tr>
</table>
{% endblock %}
