{% extends "base.html" %}
{% block content %}
<table class="panel" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="panelhead">{{ v.titles.reset }}</td></tr>
  <tr><td class="panelbody">
    <table class="okbox" cellpadding="0" cellspacing="0" border="0">
      <tr><td id="ctl00_ContentPlaceHolder1_lblReset">{{ v.messages.reset }}</td></tr>
    </table>
    <table cellpadding="3" cellspacing="0" border="0">
      <tr>
        <td class="fieldlabel">{{ v.labels.accounts_cleared }}</td>
        <td id="ctl00_ContentPlaceHolder1_lblDiscarded">{{ discarded }}</td>
      </tr>
    </table>
    <p><a href="{{ url_for('dev_faults') }}">{{ v.titles.faults }}</a></p>
  </td></tr>
</table>
{% endblock %}
