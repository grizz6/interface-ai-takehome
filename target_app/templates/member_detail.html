{% extends "base.html" %}
{% block content %}
<table class="panel" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="panelhead">{{ v.titles.detail }} - {{ v.labels.member_id }} {{ member.member_id }}</td></tr>
  <tr><td class="panelbody">
    <!-- The main content area is a separate document inside an iframe, the way a
         framed legacy console would serve it. Anything driving this page has to
         cross the frame boundary to reach the controls. -->
    <iframe class="mainframe" name="maincontent"
            src="{{ url_for('member_panel', member_id=member.member_id) }}"></iframe>
  </td></tr>
</table>
{% endblock %}
