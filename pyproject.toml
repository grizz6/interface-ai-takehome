[project]
name = "computer-use-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.60",  # mode="ai" and boxes are not available before this
    "pydantic>=2",
    "google-genai>=2.3.0",  # Interactions API needs 2.3 or later
    # These minimums are the versions the tests last passed on. Older ones may work too.
    "flask>=3.1",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",  # checks Signal.aria_template is valid YAML
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "mypy>=2.3",
]

[tool.mypy]
python_version = "3.11"
files = ["src/models", "src/replay", "src/surface", "src/policy", "src/discovery", "src/escalation", "src/evidence", "src/recorder", "src/catalog.py", "src/cli.py"]
strict = true

[[tool.mypy.overrides]]
# PyYAML has no type stubs, and adding types-PyYAML for one call is not worth it.
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Plain `pytest` does not put the repo root on sys.path the way `python -m pytest` does,
# so `from src.models import ...` would fail without this.
pythonpath = ["."]
testpaths = ["tests"]
