[project]
name = "computer-use-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.60",  # mode="ai" and boxes are not available before this
    "pydantic>=2",
    "google-genai>=2.3.0",  # Interactions API needs 2.3 or later
    "flask",
    "python-dotenv",
    "pyyaml",  # record-time syntax check on Signal.aria_template
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
]

[tool.mypy]
python_version = "3.11"
files = ["src/models", "src/replay", "src/surface", "src/policy", "src/discovery", "src/escalation", "src/evidence", "src/recorder", "src/catalog.py", "src/cli.py"]
strict = true

[[tool.mypy.overrides]]
# PyYAML ships no type stubs. An override here beats adding types-PyYAML as a second
# dependency for one call, and the call site is three lines wide.
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Bare `pytest` does not add the repo root to sys.path the way `python -m pytest` does,
# so `from src.models import ...` fails without this. design rules section 11 says the
# command is `pytest`, so the fix belongs in config rather than in the Makefile.
pythonpath = ["."]
testpaths = ["tests"]
