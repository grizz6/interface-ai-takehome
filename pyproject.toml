[project]
name = "computer-use-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "pydantic>=2",
    "anthropic",
    "flask",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
]

[tool.mypy]
python_version = "3.11"
files = ["src/models", "src/replay"]
strict = true
